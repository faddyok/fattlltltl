   let chips=vars.length?`<div class="variantSummary">${vars.map(v=>`<span class="vchip ${asyncMode||Number(v.stock)>0?'ok':'out'}">${esc(v.label)}: ${asyncMode?asyncLabel:(Number(v.stock)>0?Number(v.stock)+' '+t('left'):t('soldOut'))}</span>`).join('')}</div>`:'';
   let variantsWord=availableCount===1?t('variant'):t('variants');
   let metaText=asyncMode?asyncLabel:(first.stock>0?first.stock+' '+t('available')+' • '+availableCount+' '+variantsWord+' '+t('inStock'):t('selectedSoldOut'));
   return `<article class="card"><div class="badges">${badgeHTML(p)}</div><button class="fav ${wishlist.has(p.id)?'on':''}" data-fav-id="${esc(p.id)}" onclick="toggleFav('${p.id}')">${wishlist.has(p.id)?'♥':'♡'}</button><div class="pic">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="${idx<2?'eager':'lazy'}" fetchpriority="${idx<2?'high':'auto'}" decoding="async">`:esc(p.emoji||'🔑')}</div><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||'')}</div>${chips}${vars.length?`<select class="variant" id="v-${p.id}" onchange="renderCardMeta('${p.id}')">${vars.map(v=>`<option value="${esc(v.id)}" ${v.id===first.id?'selected':''}>${esc(v.label)} • ${money(v.price)}${asyncMode?' • '+asyncLabel:' • '+v.stock+' '+t('left')+(Number(v.stock)<1?' • '+t('soldOut').toUpperCase():'')}</option>`).join('')}</select>`:''}<div class="meta"><div><div class="price" id="price-${p.id}">${money(first.price)}</div><div class="stock" id="stock-${p.id}">${metaText}</div></div><button class="add" id="add-${p.id}" ${(!asyncMode&&first.stock<1)?'disabled':''} onclick="add('${p.id}')">${t('add')}</button></div></article>`
 }).join('')||`<div class="empty-state">${t('noProducts')}</div>`;
 renderCart()
}
function renderCardMeta(id){
 let p=productById(id),v=selectedVariant(p);if(!p||!v)return;
 document.getElementById('price-'+id).textContent=money(v.price);
 const emailMode=p.fulfillment_mode==='email',manualMode=p.fulfillment_mode==='manual',loginAssistMode=p.fulfillment_mode==='login_assist',asyncMode=emailMode||manualMode||loginAssistMode;
 document.getElementById('stock-'+id).textContent=emailMode?t('emailSetup'):(loginAssistMode?t('loginAssistSetup'):(manualMode?t('manualSetup'):(v.stock>0?v.stock+' '+t('available'):t('outOfStock'))));

}

async function toggleFav(id){
 const before=wishlist.has(id);before?wishlist.delete(id):wishlist.add(id);
 if(favOnly)render();else paintFav(id);
 try{
  const r=await fetch('/api/wishlist/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:Number(uid),sig,product_id:id})});
  if(!r.ok)throw new Error(await r.text());

  if(favOnly)render();else paintFav(id)
 }catch(e){before?wishlist.add(id):wishlist.delete(id);if(favOnly)render();else paintFav(id);alert(e.message||'Could not update wishlist')}

function add(id){
 const restrictions=window.shopData?.restrictions||{};if(restrictions.suspended||restrictions.purchase_blocked)return alert(t('productsRestricted'));
 let p=productById(id),v=selectedVariant(p);if(!p||!v)return;
 const emailMode=p.fulfillment_mode==='email',manualMode=p.fulfillment_mode==='manual',loginAssistMode=p.fulfillment_mode==='login_assist',asyncMode=emailMode||manualMode||loginAssistMode;
 if(!asyncMode&&v.stock<1)return;
 let key=id+':'+v.id;
 if(emailMode||loginAssistMode){cart[key]=1}else if(manualMode){cart[key]=Math.min((cart[key]||0)+1,20)}else{cart[key]=Math.min((cart[key]||0)+1,v.stock,20)}
 try{tg?.HapticFeedback?.impactOccurred('light')}catch{}
 renderCart()
}
function ch(key,d){cart[key]=(cart[key]||0)+d;if(cart[key]<=0)delete cart[key];renderCart()}
function totals(){let c=0,tv=0;for(let [key,q] of Object.entries(cart)){let [id,vid]=key.split(':');let p=productById(id),v=p&&variantOf(p,vid);if(v){c+=q;tv+=v.price*q}}return{c,t:tv}}
function cartRows(){return Object.entries(cart).map(([key,q])=>{
 let [id,vid]=key.split(':');let p=productById(id),v=p&&variantOf(p,vid);if(!p||!v)return '';
 const emailMode=p.fulfillment_mode==='email',manualMode=p.fulfillment_mode==='manual',loginAssistMode=p.fulfillment_mode==='login_assist';
 return `<div class="row"><div class="cart-thumb">${p.image?`<img src="${esc(p.image)}" alt="">`:esc(p.emoji||'🔑')}</div><div class="ri"><b>${esc(p.name)}</b><div class="muted">${esc(v.label)} • ${money(v.price*q)}${emailMode?' • 📧 '+t('emailSetup'):''}${manualMode?' • 🛠 '+t('manualSetup'):''}${loginAssistMode?' • 🔐 '+t('loginAssistSetup'):''}${p.purchase_key_required?' • 🔐 '+t('keyBadge'):''}</div></div><div class="qty"><button onclick="ch('${key}',-1)">−</button><b>${q}</b><button ${emailMode||loginAssistMode?'disabled':''} onclick="addExact('${id}','${vid}')">+</button></div></div>`
}).join('')}
function addExact(id,vid){
 const restrictions=window.shopData?.restrictions||{};if(restrictions.suspended||restrictions.purchase_blocked)return alert(t('productsRestricted'));
 let p=productById(id),v=variantOf(p,vid),key=id+':'+vid;if(!p||!v)return;
 if(p.fulfillment_mode==='email'||p.fulfillment_mode==='login_assist'){cart[key]=1}else if(p.fulfillment_mode==='manual'){cart[key]=Math.min((cart[key]||0)+1,20)}else if((cart[key]||0)<v.stock){cart[key]=(cart[key]||0)+1}
 renderCart()
}
function renderCart(forceRows=false){if(!window.shopData)return;saveCart();let tv=totals();count.textContent=tv.c;total.textContent=money(tv.t);buy.disabled=!tv.c;if(forceRows||sheet.classList.contains('open'))rows.innerHTML=cartRows()||`<div class="empty-state">${t('cartEmpty')}</div>`}
function openCart(){renderCart(true);sheet.classList.add('open');try{tg?.HapticFeedback?.impactOccurred('soft')}catch{}}
function closeCart(){sheet.classList.remove('open')}
function requirementHTML(){
 const locked=new Map();const emailLines=[];
 for(const [key,q] of Object.entries(cart)){
   const [id,vid]=key.split(':');const p=productById(id);const v=p&&variantOf(p,vid);if(!p||!v)continue;
   if(p.purchase_key_required)locked.set(p.id,p);
   if(p.fulfillment_mode==='email')emailLines.push({key,p,v});
 }
 let html='';
 if(locked.size){html+=`<div class="reqgroup"><b>🔐 ${t('keyLabel')}</b><div class="reqnote">${t('keyHelp')}</div>${[...locked.values()].map(p=>`<label>${esc(p.name)}</label><input class="reqinput" type="password" autocomplete="off" data-purchase-key="${esc(p.id)}" placeholder="${esc(t('keyLabel'))}">`).join('')}</div>`}
 if(emailLines.length){html+=`<div class="reqgroup"><b>📧 ${t('emailLabel')}</b><div class="reqnote">${t('emailHelp')}</div>${emailLines.map(({key,p,v})=>`<label>${esc(p.name)} — ${esc(v.label)}</label><input class="reqinput" type="email" inputmode="email" autocomplete="email" data-email-line="${esc(key)}" placeholder="name@example.com">`).join('')}</div>`}
 return html
}
function openConfirm(){
 let tv=totals();if(!tv.c)return;
 confirmRows.innerHTML=cartRows();confirmRows.querySelectorAll('.qty button').forEach(b=>b.remove());confirmTotal.textContent=money(tv.t);requirements.innerHTML=requirementHTML();const remaining=Number(window.shopData.balance||0)-tv.t;byId('remainingBalance').textContent=remaining<0?ax('balanceLow'):ax('balanceAfter')+': '+money(remaining);confirmPayBtn.disabled=remaining<0;
 const modes=Object.keys(cart).map(key=>{const [id]=key.split(':');return productById(id)?.fulfillment_mode});
 const hasEmail=modes.includes('email'),hasManual=modes.includes('manual'),hasLoginAssist=modes.includes('login_assist'),hasInstant=modes.includes('instant');
 confirmDelivery.textContent=hasLoginAssist?t('loginAssistPending'):(hasManual?(hasInstant||hasEmail?t('mixedPending'):t('manualPending')):(hasEmail?t('emailPending'):t('deliveryPrivate')));
 confirmSheet.classList.add('open');try{tg?.HapticFeedback?.impactOccurred('soft')}catch{}
}
function closeConfirm(){confirmSheet.classList.remove('open')}
function showSection(section){const isMethods=section==='methods';shopSection.classList.toggle('active',!isMethods);methodsSection.classList.toggle('active',isMethods);shopSectionBtn.classList.toggle('active',!isMethods);methodsSectionBtn.classList.toggle('active',isMethods);document.querySelector('.dock').style.display=isMethods?'none':'flex';brand.textContent=isMethods?t('methodsHeroTitle'):(window.shopName||t('shop'));try{tg?.HapticFeedback?.selectionChanged()}catch{}}
let currentMethodBody='';
async function copyMethodText(value,button){
 const text=String(value||'');if(!text)return;
 let ok=false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);ok=true}}catch{}
 if(!ok){try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch{}}
 if(button&&ok){const old=button.textContent;button.textContent='✓ '+t('copied');button.classList.add('method-copy-ok');setTimeout(()=>{button.textContent=old;button.classList.remove('method-copy-ok')},1100)}
 try{if(ok)tg?.HapticFeedback?.notificationOccurred('success')}catch{}
}
function methodBodyHtml(text){
 const raw=String(text||''),re=/https?:\/\/[^\s<>"']+/gi;let out='',pos=0,match;
 while((match=re.exec(raw))){out+=esc(raw.slice(pos,match.index)).replace(/\n/g,'<br>');let url=match[0],trail='';while(url&&/[.,;:!?]$/.test(url)){trail=url.slice(-1)+trail;url=url.slice(0,-1)}const safe=esc(url);out+=`<span class="method-link-wrap"><a class="method-link" href="${safe}" target="_blank" rel="noopener noreferrer">${safe}</a><button type="button" class="method-copy-link" data-url="${safe}">📋 ${t('copyLink')}</button></span>${esc(trail)}`;pos=match.index+match[0].length}
 out+=esc(raw.slice(pos)).replace(/\n/g,'<br>');return `<div class="method-text">${out}</div>`
}
function wireMethodBody(){
 methodDetailBody.querySelectorAll('.method-copy-link').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();copyMethodText(btn.dataset.url||'',btn)}));
 methodDetailBody.querySelectorAll('a.method-link').forEach(a=>a.addEventListener('click',e=>{const url=a.href;try{if(tg?.openLink){e.preventDefault();tg.openLink(url)}}catch{}}));
}
function renderMethodGalleryDetail(method){
 const cover=String(method?.image||''),gallery=Array.isArray(method?.gallery)?method.gallery.filter(Boolean):[],images=[];if(cover)images.push(cover);gallery.forEach(x=>{if(x&&!images.includes(x))images.push(x)});
 const main=images[0]||'';methodDetailImage.innerHTML=main?`<img src="${esc(main)}" decoding="async">`:'📘';
 const thumbs=images.length>1?images:gallery;methodDetailGallery.innerHTML=thumbs.map((src,i)=>`<button type="button" class="${src===main?'active':''}" data-src="${esc(src)}"><img src="${esc(src)}" loading="lazy" decoding="async"></button>`).join('');
 methodDetailGallery.querySelectorAll('button[data-src]').forEach(btn=>btn.addEventListener('click',()=>{const src=btn.dataset.src||'';if(!src)return;methodDetailImage.innerHTML=`<img src="${esc(src)}" decoding="async">`;methodDetailGallery.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===btn));try{tg?.HapticFeedback?.selectionChanged()}catch{}}));
}
copyMethodBtn.addEventListener('click',()=>copyMethodText(currentMethodBody,copyMethodBtn));
function renderMethods(){if(!window.shopData)return;const q=methodSearch.value.toLowerCase();const filter=byId('methodFilter').value;const list=methods.filter(m=>`${m.title} ${m.summary||''}`.toLowerCase().includes(q)&&(filter==='all'||(filter==='free'&&m.is_free)||(filter==='premium'&&!m.is_free)||(filter==='owned'&&m.unlocked)));methodsGrid.innerHTML=list.map((m,idx)=>`<article class="methodcard"><div class="methodimg">${m.image?`<img src="${esc(m.image)}" alt="${esc(m.title)}" loading="${idx<2?'eager':'lazy'}" fetchpriority="${idx<2?'high':'auto'}" decoding="async">`:'📘'}</div><div class="name">${esc(m.title)}</div><div class="desc">${esc(m.summary||t('noPreview'))}</div><div class="price">${m.unlocked?t('unlocked'):m.is_free?t('free'):money(m.price||0)}</div><button class="add" style="margin-top:10px" onclick="event.stopPropagation();methodAction('${m.id}')">${m.unlocked?t('openMethod'):m.is_free?t('claimFree'):t('buyMethod')}</button></article>`).join('')||`<div class="empty-state">${t('noMethods')}</div>`}
async function methodAction(id){let m=methodById(id);if(!m)return;if(!m.unlocked){const restrictions=window.shopData?.restrictions||{};if(restrictions.suspended||restrictions.methods_blocked)return alert(t('methodsRestricted'));if(!m.is_free&&!confirm(t('buyConfirm')(m.title,Number(m.price||0).toLocaleString())))return;try{const r=await fetch('/api/method/'+encodeURIComponent(id)+'/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.id,sig})});const d=await r.json();if(!r.ok)throw new Error(d.detail||t('unlockFail'));m.unlocked=true;if(Number.isFinite(Number(d.balance))){window.shopData.balance=Number(d.balance);balance.textContent='💳 '+money(d.balance)}renderMethods();if(d.delivery_warning)alert(d.delivery_warning);else if(d.delivery_sent){m.telegram_delivered=true;try{tg?.HapticFeedback?.notificationOccurred('success')}catch{}}}catch(e){alert(e.message);return}}openMethod(id)}
async function openMethod(id){try{const r=await fetch('/api/method/'+encodeURIComponent(id)+'?user_id='+encodeURIComponent(user.id)+'&sig='+encodeURIComponent(sig));const m=await r.json();if(!r.ok)throw new Error(m.detail||t('openFail'));methodDetailTitle.textContent=m.title||t('method');methodDeliveryNote.textContent=methodById(id)?.telegram_delivered?'✅ '+t('methodSent'):'';currentMethodBody=String(m.body||'');renderMethodGalleryDetail(m);methodDetailBody.innerHTML=methodBodyHtml(currentMethodBody);wireMethodBody();methodSheet.classList.add('open')}catch(e){alert(e.message)}}
function closeMethod(){methodSheet.classList.remove('open')}
function openLanguage(){languageSheet.classList.add('open')}function closeLanguage(){languageSheet.classList.remove('open')}
async function setLanguage(next){if(!['en','id'].includes(next)||next===lang){closeLanguage();return}try{let r=await fetch('/api/language',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:Number(uid),sig,language:next})});if(!r.ok)throw new Error(await r.text());lang=next;applyI18n();closeLanguage();try{tg?.HapticFeedback?.notificationOccurred('success')}catch{}}catch(e){alert(t('languageSaveFail'))}}
function buyCredits(){const rates=(window.shopData&&window.shopData.creditRates)||{inr:'₹1 = 1 credit',usd:'$1 = 100 credits'};const owner=(window.shopData&&window.shopData.ownerUsername)||'';const msg=`${t('contactHello')}\nTelegram ID: ${user.id}\n${t('contactRates')}: ${rates.inr} | ${rates.usd}\n${t('contactAsk')}`;if(owner){tg.openTelegramLink(`https://t.me/${owner}?text=${encodeURIComponent(msg)}`)}else{alert(`${t('rates')}:\n${rates.inr}\n${rates.usd}\n\n${t('adminNotConfigured')}`)}}
async function checkout(){
 if(confirmPayBtn.disabled)return;
 if(navigator.onLine===false)return toast(ax('offline'));
 let items=Object.entries(cart).map(([key,qty])=>{let [id,variant_id]=key.split(':');return{id,variant_id,qty}});
 if(!items.length)return;
 const purchase_keys={};const emails={};
 for(const input of document.querySelectorAll('[data-purchase-key]')){
   const pid=input.dataset.purchaseKey;const value=input.value.trim();
   if(!value){input.focus();return alert(t('keyMissing'))}
   purchase_keys[pid]=value
 }
 for(const input of document.querySelectorAll('[data-email-line]')){
   const value=input.value.trim();
   if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value)){input.focus();return alert(t('emailInvalid'))}
   emails[input.dataset.emailLine]=value
 }
 const order={type:'order',items,purchase_keys,emails};
 const serialized=JSON.stringify(order);if(new TextEncoder().encode(serialized).length>4096)return toast(ax('payloadLimit'));
 if(!tg?.sendData)return alert(t('openTelegram'));
 const oldText=confirmPayBtn.textContent;confirmPayBtn.disabled=true;confirmPayBtn.textContent=t('validating');
 try{
   const r=await fetch('/api/order/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:Number(uid),sig,order})});
   let data={};try{data=await r.json()}catch{}
   if(!r.ok)throw new Error(data.detail||t('checkoutFailed'));
   if(Number(data.total)!==totals().t){closeConfirm();await init();throw new Error(ax('priceChanged'))}
   try{tg?.HapticFeedback?.notificationOccurred('success')}catch{};tg.sendData(serialized);clearSavedCart();tg.close()
 }catch(e){alert(e.message||t('checkoutFailed'));confirmPayBtn.disabled=false;confirmPayBtn.textContent=oldText}
}
