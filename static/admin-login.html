<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090c12;color:white;font-family:Inter,system-ui;background-image:radial-gradient(circle at 50% 0,#3a256d,transparent 42%)}.box{width:min(410px,90vw);background:#121722;border:1px solid #ffffff15;border-radius:26px;padding:26px;box-shadow:0 30px 80px #0008}h1{margin:0 0 8px}p{color:#9aa6b9}input{width:100%;box-sizing:border-box;padding:14px;border-radius:14px;border:1px solid #ffffff17;background:#0b0f16;color:white;margin:9px 0}button{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#a349ff);color:white;font-weight:900}.muted{font-size:12px;color:#8490a4}
</style></head><body><form class="box" action="/admin/login" method="post"><h1>🛠 Fattle Admin</h1><p>Products, inventory, orders, customers and analytics.</p><input name="password" type="password" placeholder="Admin password" required><input name="totp" inputmode="numeric" autocomplete="one-time-code" placeholder="2FA code (only if enabled)"><div class="muted">If ADMIN_TOTP_SECRET is not configured, leave the 2FA field empty.</div><button style="margin-top:14px">Open dashboard</button></form></body></html>
